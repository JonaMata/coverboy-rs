name: Build package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
    - name: Install cargo deb
      run: cargo install cargo-deb
#    - name: Install rust target
#      run: rustup target add aarch64-unknown-linux-gnu
#    - name: Configure cross-compilation linker
#      run: |
#        mkdir -p ~/.cargo
#        printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> ~/.cargo/config.toml
#    - name: Build
#      run: cargo deb --verbose
    - name: Install cross
      run: cargo install cross
    - name: Build
      run: cross build --target aarch64-unknown-linux-gnu --release
    - name: Package
      run: cargo deb --no-build --target aarch64-unknown-linux-gnu --verbose
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: deb
        path: target/debug/coverboy
        archive: false
