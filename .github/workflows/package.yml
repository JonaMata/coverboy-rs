name: Build package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install cross-compile aarch64 toolchain
      run: sudo apt install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross libgcc-12-dev-arm64-cross binutils-aarch64-linux-gnu
    - name: Install cargo deb
      run: cargo install cargo-deb
    - name: Install rust target
      run: rustup target add aarch64-unknown-linux-gnu
    - name: Build
      run: cargo deb --verbose --target aarch64-unknown-linux-gnu
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: deb
        path: target/debian/*.deb
        archive: false
