name: Build package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
  RUSTFLAGS: "-C target-cpu=cortex-a53"

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
    - name: Install libs
      run: sudo apt-get install -y libheif-dev libsharpyuv-dev libwebp-dev
    - name: Install cargo deb
      run: cargo install cargo-deb
#    - name: Install rust target
#      run: rustup target add aarch64-unknown-linux-gnu
#    - name: Configure cross-compilation linker
#      run: |
#        mkdir -p ~/.cargo
#        printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> ~/.cargo/config.toml
#    - name: Build
#      run: cargo deb --verbose
    - name: Install cross
      run: cargo install cross
    - name: Debug build
      run: cross build --target aarch64-unknown-linux-gnu
    - name: Release build
      run: cross build --target aarch64-unknown-linux-gnu --release
    - name: Package
      run: cargo deb --no-strip --no-build --verbose --target aarch64-unknown-linux-gnu
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: debug executable
        path: target/aarch64-unknown-linux-gnu/debug/coverboy
        archive: false
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: release package
        path: target/aarch64-unknown-linux-gnu/debian/coverboy*.deb
        archive: false
